<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>

  <text x="40" y="36" font-size="18" font-weight="700" fill="#1e293b">Keys + Hash Slots per Node</text>
  <text x="40" y="56" font-size="13" fill="#10b981" font-weight="600">✓ Balanced — CRC16 slot distribution is even</text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="80" y1="290" x2="680" y2="290"/>
    <line x1="80" y1="230" x2="680" y2="230" stroke-dasharray="3 4"/>
    <line x1="80" y1="170" x2="680" y2="170" stroke-dasharray="3 4"/>
    <line x1="80" y1="110" x2="680" y2="110" stroke-dasharray="3 4"/>
  </g>
  <g font-size="11" fill="#94a3b8" text-anchor="end">
    <text x="72" y="294">0</text>
    <text x="72" y="234">1M</text>
    <text x="72" y="174">2M keys</text>
    <text x="72" y="114">3M</text>
  </g>

  <!-- balanced ~1.7M keys -->
  <g fill="#10b981">
    <rect x="110" y="180" width="60" height="110" rx="3"/>
    <rect x="210" y="178" width="60" height="112" rx="3"/>
    <rect x="310" y="184" width="60" height="106" rx="3"/>
    <rect x="410" y="180" width="60" height="110" rx="3"/>
    <rect x="510" y="178" width="60" height="112" rx="3"/>
    <rect x="610" y="182" width="60" height="108" rx="3"/>
  </g>

  <g font-size="11" font-weight="600" text-anchor="middle" fill="#475569">
    <text x="140" y="172">1.71M</text>
    <text x="240" y="170">1.73M</text>
    <text x="340" y="176">1.68M</text>
    <text x="440" y="172">1.71M</text>
    <text x="540" y="170">1.73M</text>
    <text x="640" y="174">1.70M</text>
  </g>

  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="140" y="310">node-0001</text>
    <text x="240" y="310">node-0002</text>
    <text x="340" y="310">node-0003</text>
    <text x="440" y="310">node-0004</text>
    <text x="540" y="310">node-0005</text>
    <text x="640" y="310">node-0006</text>
  </g>
</svg>
