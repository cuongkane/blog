<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>

  <text x="40" y="36" font-size="18" font-weight="700" fill="#1e293b">Cache Hit Rate per Node (hits/sec)</text>
  <text x="40" y="56" font-size="13" fill="#dc2626" font-weight="600">⚠ Smoking gun — same nodes receive ~2× the reads</text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="80" y1="290" x2="680" y2="290"/>
    <line x1="80" y1="240" x2="680" y2="240" stroke-dasharray="3 4"/>
    <line x1="80" y1="190" x2="680" y2="190" stroke-dasharray="3 4"/>
    <line x1="80" y1="140" x2="680" y2="140" stroke-dasharray="3 4"/>
    <line x1="80" y1="90"  x2="680" y2="90"  stroke-dasharray="3 4"/>
  </g>
  <g font-size="11" fill="#94a3b8" text-anchor="end">
    <text x="72" y="294">0</text>
    <text x="72" y="244">1.5k</text>
    <text x="72" y="194">3k</text>
    <text x="72" y="144">4.5k</text>
    <text x="72" y="94">6k hits/s</text>
  </g>

  <!-- values: 2.8k, 3.1k, 2.5k, 5.1k, 2.9k, 5.3k; scale: 200px = 6k -->
  <g>
    <rect x="110" y="197" width="60" height="93"  fill="#3b82f6" rx="3"/>
    <rect x="210" y="187" width="60" height="103" rx="3" fill="#3b82f6"/>
    <rect x="310" y="207" width="60" height="83"  fill="#3b82f6" rx="3"/>
    <rect x="410" y="120" width="60" height="170" fill="#dc2626" rx="3"/>
    <rect x="510" y="193" width="60" height="97"  fill="#3b82f6" rx="3"/>
    <rect x="610" y="114" width="60" height="176" fill="#dc2626" rx="3"/>
  </g>

  <g font-size="11" font-weight="600" text-anchor="middle">
    <text x="140" y="189" fill="#475569">2.8k</text>
    <text x="240" y="179" fill="#475569">3.1k</text>
    <text x="340" y="199" fill="#475569">2.5k</text>
    <text x="440" y="112" fill="#b91c1c">5.1k</text>
    <text x="540" y="185" fill="#475569">2.9k</text>
    <text x="640" y="106" fill="#b91c1c">5.3k</text>
  </g>

  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="140" y="310">node-0001</text>
    <text x="240" y="310">node-0002</text>
    <text x="340" y="310">node-0003</text>
    <text x="440" y="310" font-weight="700" fill="#b91c1c">node-0004</text>
    <text x="540" y="310">node-0005</text>
    <text x="640" y="310" font-weight="700" fill="#b91c1c">node-0006</text>
  </g>

  <g transform="translate(40,335)" font-size="11" fill="#475569">
    <rect x="0"  y="-9" width="12" height="12" fill="#3b82f6" rx="2"/>
    <text x="18" y="1">Normal</text>
    <rect x="80" y="-9" width="12" height="12" fill="#dc2626" rx="2"/>
    <text x="98" y="1">Hot node</text>
  </g>
</svg>
