<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="720" height="360" fill="#ffffff"/>

  <text x="40" y="36" font-size="18" font-weight="700" fill="#1e293b">Memory Usage % per Node</text>
  <text x="40" y="56" font-size="13" fill="#10b981" font-weight="600">✓ Balanced — sharding is working correctly</text>

  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="80" y1="290" x2="680" y2="290"/>
    <line x1="80" y1="240" x2="680" y2="240" stroke-dasharray="3 4"/>
    <line x1="80" y1="190" x2="680" y2="190" stroke-dasharray="3 4"/>
    <line x1="80" y1="140" x2="680" y2="140" stroke-dasharray="3 4"/>
    <line x1="80" y1="90"  x2="680" y2="90"  stroke-dasharray="3 4"/>
  </g>
  <g font-size="11" fill="#94a3b8" text-anchor="end">
    <text x="72" y="294">0%</text>
    <text x="72" y="244">25%</text>
    <text x="72" y="194">50%</text>
    <text x="72" y="144">75%</text>
    <text x="72" y="94">100%</text>
  </g>

  <!-- balanced ~50% with tiny variation -->
  <g fill="#10b981">
    <rect x="110" y="190" width="60" height="100" rx="3"/>
    <rect x="210" y="186" width="60" height="104" rx="3"/>
    <rect x="310" y="192" width="60" height="98"  rx="3"/>
    <rect x="410" y="188" width="60" height="102" rx="3"/>
    <rect x="510" y="190" width="60" height="100" rx="3"/>
    <rect x="610" y="186" width="60" height="104" rx="3"/>
  </g>

  <g font-size="11" font-weight="600" text-anchor="middle" fill="#475569">
    <text x="140" y="182">50%</text>
    <text x="240" y="178">52%</text>
    <text x="340" y="184">49%</text>
    <text x="440" y="180">51%</text>
    <text x="540" y="182">50%</text>
    <text x="640" y="178">52%</text>
  </g>

  <g font-size="11" fill="#475569" text-anchor="middle">
    <text x="140" y="310">node-0001</text>
    <text x="240" y="310">node-0002</text>
    <text x="340" y="310">node-0003</text>
    <text x="440" y="310">node-0004</text>
    <text x="540" y="310">node-0005</text>
    <text x="640" y="310">node-0006</text>
  </g>
</svg>
