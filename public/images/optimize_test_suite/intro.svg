<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="capL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 5 L 10 1 L 10 9 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="720" height="405" fill="url(#bg)"/>

  <!-- Title -->
  <text x="360" y="54" text-anchor="middle" font-size="30" font-weight="700" fill="#1e293b">From 55 Minutes to 20</text>
  <text x="360" y="82" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b" letter-spacing="3">ONE CI JOB PER MODULE</text>

  <!-- BEFORE -->
  <text x="40" y="126" font-size="12" font-weight="700" fill="#dc2626" letter-spacing="1.5">BEFORE</text>
  <text x="40" y="142" font-size="11" fill="#94a3b8">1 job</text>
  <rect x="150" y="112" width="486" height="30" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="160" y="131" font-size="12" fill="#991b1b">everything, serially — ~1,500 test files</text>
  <text x="626" y="131" text-anchor="end" font-size="12" font-weight="700" fill="#991b1b">55 min</text>

  <!-- AFTER -->
  <text x="40" y="236" font-size="12" font-weight="700" fill="#059669" letter-spacing="1.5">AFTER</text>
  <text x="40" y="252" font-size="11" fill="#94a3b8">5 jobs, parallel</text>
  <text x="40" y="270" font-size="9.5" fill="#b4bcc9">shorter bars are</text>
  <text x="40" y="282" font-size="9.5" fill="#b4bcc9">illustrative</text>

  <g fill="#d1fae5" stroke="#10b981" stroke-width="1.5">
    <rect x="150" y="172" width="177" height="22" rx="3"/>
    <rect x="150" y="200" width="132" height="22" rx="3"/>
    <rect x="150" y="228" width="120" height="22" rx="3"/>
    <rect x="150" y="256" width="100" height="22" rx="3"/>
    <rect x="150" y="284" width="84"  height="22" rx="3"/>
  </g>

  <g font-size="11" fill="#065f46">
    <text x="157" y="187">orders_api</text>
    <text x="157" y="215">orders_core</text>
    <text x="157" y="243">platform</text>
    <text x="157" y="271">reporting</text>
    <text x="157" y="299">others</text>
  </g>
  <text x="320" y="187" text-anchor="end" font-size="11" font-weight="700" fill="#065f46">20 min</text>

  <!-- longest-group guide -->
  <line x1="327" y1="166" x2="327" y2="316" stroke="#059669" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- time axis -->
  <line x1="150" y1="316" x2="680" y2="316" stroke="#cbd5e1" stroke-width="1"/>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="150" y1="316" x2="150" y2="321"/>
    <line x1="282" y1="316" x2="282" y2="321"/>
    <line x1="415" y1="316" x2="415" y2="321"/>
    <line x1="547" y1="316" x2="547" y2="321"/>
    <line x1="680" y1="316" x2="680" y2="321"/>
  </g>
  <g font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="150" y="334">0</text>
    <text x="282" y="334">15</text>
    <text x="415" y="334">30</text>
    <text x="547" y="334">45</text>
    <text x="676" y="334">60 min</text>
  </g>

  <!-- saved span -->
  <text x="481" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">~35 min saved</text>
  <line x1="327" y1="364" x2="636" y2="364" stroke="#059669" stroke-width="1.5" marker-start="url(#capL)" marker-end="url(#capL)"/>

  <!-- Footer note -->
  <text x="360" y="390" text-anchor="middle" font-size="13" fill="#64748b">Same tests. Same coverage gate. Nothing shared between jobs.</text>
</svg>
